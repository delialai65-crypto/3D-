<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLAG WAR 3D INFINITY ONLINE</title>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050817;color:#eafaff;
 font-family:Arial,"Microsoft JhengHei",sans-serif
}
header{
 padding:16px;background:#0a1930;border-bottom:1px solid #00bde8;
 display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px
}
.logo{font-size:20px;font-weight:bold;color:#00eaff}
main{max-width:1150px;margin:auto;padding:16px}
.panel{
 background:#0c1930;border:1px solid #155376;
 border-radius:12px;padding:17px;margin:12px 0
}
h1,h2,h3{color:#00eaff}
input{
 display:block;width:100%;max-width:400px;margin:8px 0;
 padding:12px;background:#061226;color:white;
 border:1px solid #28618a;border-radius:7px
}
button{
 background:#103b5c;border:1px solid #00bde8;color:white;
 padding:11px 15px;border-radius:8px;margin:4px;cursor:pointer
}
button:hover{background:#12618a}
button:disabled{opacity:.4}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.card{background:#102440;border:1px solid #235071;border-radius:9px;padding:13px}
.stat{font-size:23px;color:#00eaff;font-weight:bold}
.muted{color:#9ab3cb;font-size:13px}
#game{height:65vh;min-height:390px;position:relative;overflow:hidden;
 background:#030713;border:1px solid #00bde8;border-radius:10px}
#game canvas{display:block;width:100%;height:100%}
#gameHUD{position:absolute;top:10px;left:10px;right:10px;
 display:flex;justify-content:space-between;pointer-events:none;gap:8px}
.hud{background:#07152be8;border:1px solid #00bde8;
 padding:9px;border-radius:7px;font-size:13px}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 color:#00ffff;font-size:27px;text-shadow:0 0 10px cyan;pointer-events:none}
#gameControls{position:absolute;bottom:10px;left:10px;
 background:#07152be8;padding:9px;border-radius:7px;font-size:12px}
#notice{padding:10px;color:#9cf5ff}
table{width:100%;border-collapse:collapse}
td,th{padding:9px;border-bottom:1px solid #23435f;text-align:left}
#loginPanel{max-width:450px;margin:8vh auto}
</style>
</head>
<body>

<header>
 <div class="logo">✦ FLAG WAR 3D INFINITY ONLINE</div>
 <div id="connection">尚未連線</div>
</header>

<main>
<section id="loginPanel" class="panel">
 <h1>NEON COMMAND</h1>
 <p class="muted">建立帳號或登入既有玩家資料</p>
 <input id="username" maxlength="20" placeholder="玩家名稱">
 <input id="password" type="password" placeholder="密碼（至少 10 字元）">
 <button onclick="account('register')">建立帳號</button>
 <button onclick="account('login')">登入</button>
 <p id="authMessage" class="muted"></p>
</section>

<section id="dashboard" class="hidden">
 <div class="panel">
  <h2>玩家指揮中心</h2>
  <div class="grid">
   <div class="card">玩家<strong id="playerName" class="stat">-</strong></div>
   <div class="card">等級<strong id="playerLevel" class="stat">1</strong></div>
   <div class="card">排位<strong id="playerRating" class="stat">0</strong></div>
   <div class="card">金幣<strong id="playerCoins" class="stat">1000</strong></div>
   <div class="card">勝場<strong id="playerWins" class="stat">0</strong></div>
   <div class="card">標記數<strong id="playerTags" class="stat">0</strong></div>
  </div>
  <button onclick="joinMatch()">尋找多人戰場</button>
  <button onclick="refreshProfile()">更新玩家資料</button>
  <button onclick="logout()">登出</button>
  <p id="notice">等待操作。</p>
 </div>

 <div class="panel">
  <h2>多人戰場</h2>
  <p id="roomInfo">尚未加入房間</p>
  <div id="game" class="hidden">
   <div id="gameHUD">
    <div class="hud">
     <strong id="teamInfo">隊伍</strong><br>
     <span id="scoreInfo">藍隊 0 : 0 紅隊</span>
    </div>
    <div class="hud">
     <span id="clockInfo">等待開始</span><br>
     <span id="playerCount">玩家 0</span>
    </div>
   </div>
   <div id="crosshair">+</div>
   <div id="gameControls">
    WASD 移動｜滑鼠轉向｜點擊能量標記<br>
    點擊畫面取得滑鼠控制，ESC 釋放
    <br><button onclick="leaveMatch()">離開房間</button>
   </div>
  </div>
 </div>

 <div class="panel">
  <h2>全球排行榜 TOP 50</h2>
  <button onclick="loadLeaderboard()">更新排行榜</button>
  <div style="overflow-x:auto">
   <table>
    <thead>
     <tr><th>排名</th><th>玩家</th><th>等級</th>
     <th>排位分數</th><th>勝場</th><th>標記</th></tr>
    </thead>
    <tbody id="leaderboard"></tbody>
   </table>
  </div>
 </div>
</section>
</main>

<script>
"use strict";

const API="";
let token=sessionStorage.getItem("fw_token");
let socket=null;
let me=null;
let roomId=null;
let myTeam=null;
let game=null;
let keys={};
let lastMoveSent=0;
let localX=0,localZ=0,yaw=0;
let remotePlayers=new Map();

const $=id=>document.getElementById(id);

function message(text){
 $("notice").textContent=text;
}
async function api(url,options={}){
 const headers={"Content-Type":"application/json",...(options.headers||{})};
 if(token)headers.Authorization="Bearer "+token;

 const response=await fetch(API+url,{...options,headers});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data.error||"伺服器錯誤");
 return data;
}

// -----------------------
// ACCOUNT
// -----------------------
async function account(action){
 const username=$("username").value.trim();
 const password=$("password").value;

 $("authMessage").textContent="處理中...";

 try{
  const data=await api("/api/"+action,{
   method:"POST",
   body:JSON.stringify({username,password})
  });

  token=data.token;
  sessionStorage.setItem("fw_token",token);
  me=data.user;

  $("loginPanel").classList.add("hidden");
  $("dashboard").classList.remove("hidden");

  updateProfile(me);
  connectSocket();
  loadLeaderboard();
  message("登入成功，歡迎 "+me.username);
 }catch(error){
  $("authMessage").textContent=error.message;
 }
}

function updateProfile(user){
 me=user;
 $("playerName").textContent=user.username;
 $("playerLevel").textContent=user.level;
 $("playerRating").textContent=user.rating;
 $("playerCoins").textContent=user.coins;
 $("playerWins").textContent=user.wins;
 $("playerTags").textContent=user.tags;
}

async function refreshProfile(){
 try{
  const data=await api("/api/me");
  updateProfile(data.user);
  message("玩家資料已更新");
 }catch(e){message(e.message)}
}

async function loadLeaderboard(){
 try{
  const data=await api("/api/leaderboard");
  $("leaderboard").innerHTML=data.leaderboard.map((p,i)=>`
   <tr>
    <td>${i+1}</td>
    <td>${escapeHTML(p.username)}</td>
    <td>${p.level}</td>
    <td>${p.rating}</td>
    <td>${p.wins}</td>
    <td>${p.tags}</td>
   </tr>`).join("");
 }catch(e){message(e.message)}
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

// -----------------------
// SOCKET CONNECTION
// -----------------------
function connectSocket(){
 if(socket)socket.disconnect();

 socket=io({
  auth:{token},
  transports:["websocket","polling"]
 });

 socket.on("connect",()=>{
  $("connection").textContent="● 線上連線";
  $("connection").style.color="#00ffad";
 });

 socket.on("disconnect",()=>{
  $("connection").textContent="○ 連線中斷";
  $("connection").style.color="#ff6a86";
 });

 socket.on("connect_error",err=>{
  message("連線錯誤："+err.message);
 });

 socket.on("match:joined",data=>{
  roomId=data.room;
  myTeam=data.team;
  $("roomInfo").textContent="房間："+roomId+"｜隊伍："+myTeam;
  $("teamInfo").textContent="你的隊伍："+myTeam;
  $("game").classList.remove("hidden");
  createGame();
  updateRoom(data.state);
  message("已加入房間，等待其他玩家");
 });

 socket.on("room:state",updateRoom);

 socket.on("match:started",data=>{
  $("clockInfo").textContent="戰鬥開始！ "+data.seconds+" 秒";
  message("多人戰鬥開始！");
 });

 socket.on("match:clock",data=>{
  $("clockInfo").textContent="剩餘 "+data.seconds+" 秒";
  $("scoreInfo").textContent=
   "藍隊 "+data.blue+" : "+data.red+" 紅隊";
 });

 socket.on("player:moved",data=>{
  updateRemote(data);
 });

 socket.on("tag:scored",data=>{
  $("scoreInfo").textContent=
   "藍隊 "+data.blue+" : "+data.red+" 紅隊";
  message(data.attacker+" 完成一次能量標記！");
 });

 socket.on("tag:miss",()=>{
  message("沒有標記到對方玩家");
 });

 socket.on("match:ended",data=>{
  message("比賽結束："+data.winner+"｜藍隊 "+
   data.blue+" : "+data.red+" 紅隊");
  $("clockInfo").textContent="比賽結束";
  refreshProfile();
  loadLeaderboard();
 });

 socket.on("room:error",data=>{
  message(data.message||"房間發生錯誤");
 });
}

function joinMatch(){
 if(!socket||!socket.connected){
  message("目前未連線，請重新登入");
  return;
 }
 socket.emit("match:join");
 message("正在尋找可加入的房間...");
}

function leaveMatch(){
 if(socket)socket.emit("match:leave");
 cleanupGame();
 roomId=null;
 $("roomInfo").textContent="尚未加入房間";
 $("game").classList.add("hidden");
 document.exitPointerLock?.();
 message("已離開戰場");
}

// -----------------------
// THREE.JS FPS WORLD
// -----------------------
function createGame(){
 cleanupGame();

 const T=THREE;
 const container=$("game");
 const width=container.clientWidth;
 const height=container.clientHeight;

 const scene=new T.Scene();
 scene.background=new T.Color(0x07152d);
 scene.fog=new T.Fog(0x07152d,30,95);

 const camera=new T.PerspectiveCamera(75,width/height,.1,150);
 camera.position.set(0,1.7,8);

 const renderer=new T.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.setSize(width,height);
 container.insertBefore(renderer.domElement,$("gameHUD"));

 scene.add(new T.HemisphereLight(0x9ceaff,0x142040,2));

 const light=new T.DirectionalLight(0xffffff,1.6);
 light.position.set(10,20,5);
 scene.add(light);

 const floor=new T.Mesh(
  new T.PlaneGeometry(100,100),
  new T.MeshStandardMaterial({color:0x101d39})
 );
 floor.rotation.x=-Math.PI/2;
 scene.add(floor);

 const grid=new T.GridHelper(100,50,0x00cfff,0x173c63);
 grid.position.y=.02;
 scene.add(grid);

 const wallMat=new T.MeshStandardMaterial({
  color:0x173654,metalness:.6,roughness:.4
 });
 const cyanMat=new T.MeshStandardMaterial({
  color:0x00dfff,emissive:0x007b99
 });

 for(let i=0;i<22;i++){
  const x=(Math.random()-.5)*75;
  const z=(Math.random()-.5)*75;
  if(Math.abs(x)<8&&Math.abs(z)<8)continue;

  const h=3+Math.random()*8;
  const b=new T.Mesh(new T.BoxGeometry(4,h,4),wallMat);
  b.position.set(x,h/2,z);
  scene.add(b);

  const line=new T.Mesh(new T.BoxGeometry(4,.08,.08),cyanMat);
  line.position.set(x,h*.7,z);
  scene.add(line);
 }

 // First-person energy display
 const hand=new T.Mesh(
  new T.BoxGeometry(.22,.2,.65),
  new T.MeshStandardMaterial({color:0x176a99,metalness:.7})
 );
 hand.position.set(.4,-.36,-.65);
 camera.add(hand);

 const energyCore=new T.Mesh(
  new T.SphereGeometry(.09,12,12),
  new T.MeshBasicMaterial({color:0x00ffff})
 );
 energyCore.position.set(.4,-.31,-1.05);
 camera.add(energyCore);
 scene.add(camera);

 game={
  scene,camera,renderer,
  remotes:new Map(),
  running:true
 };

 const onKeyDown=e=>{keys[e.key.toLowerCase()]=true};
 const onKeyUp=e=>{keys[e.key.toLowerCase()]=false};

 const onMouseMove=e=>{
  if(document.pointerLockElement!==renderer.domElement)return;
  yaw-=e.movementX*.002;
 };

 const onMouseDown=e=>{
  if(e.button!==0)return;
  if(document.pointerLockElement!==renderer.domElement){
   renderer.domElement.requestPointerLock?.();
   return;
  }
  if(socket&&socket.connected)socket.emit("player:tag");
 };

 const onClick=()=>{
  renderer.domElement.requestPointerLock?.();
 };

 const onResize=()=>{
  if(!game||!game.running)return;
  const w=container.clientWidth;
  const h=container.clientHeight;
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w,h);
 };

 renderer.domElement.addEventListener("click",onClick);
 renderer.domElement.addEventListener("mousedown",onMouseDown);
 window.addEventListener("keydown",onKeyDown);
 window.addEventListener("keyup",onKeyUp);
 document.addEventListener("mousemove",onMouseMove);
 window.addEventListener("resize",onResize);

 game.handlers={onClick,onMouseDown,onKeyDown,onKeyUp,onMouseMove,onResize};

 let last=performance.now();

 function animate(now){
  if(!game||!game.running)return;
  game.frame=requestAnimationFrame(animate);

  const dt=Math.min((now-last)/16.67,2);
  last=now;

  const speed=.12*dt;
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw);
  const rx=Math.cos(yaw),rz=-Math.sin(yaw);

  if(keys.w){localX+=fx*speed;localZ+=fz*speed}
  if(keys.s){localX-=fx*speed;localZ-=fz*speed}
  if(keys.a){localX-=rx*speed;localZ-=rz*speed}
  if(keys.d){localX+=rx*speed;localZ+=rz*speed}

  localX=Math.max(-45,Math.min(45,localX));
  localZ=Math.max(-45,Math.min(45,localZ));

  camera.position.set(localX,1.7,localZ);
  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;

  if(now-lastMoveSent>60){
   lastMoveSent=now;
   if(socket&&socket.connected){
    socket.emit("player:move",{
     x:localX,z:localZ,yaw
    });
   }
  }

  renderer.render(scene,camera);
 }

 game.frame=requestAnimationFrame(animate);
}

function updateRoom(state){
 if(!state||!game)return;

 $("playerCount").textContent="玩家 "+state.players.length;
 $("scoreInfo").textContent=
  "藍隊 "+state.blue+" : "+state.red+" 紅隊";

 for(const p of state.players){
  if(p.id===me.id)continue;
  updateRemote(p);
 }
}

function updateRemote(p){
 if(!game)return;

 let mesh=game.remotes.get(p.id);

 if(!mesh){
  const color=p.team==="blue"?0x168cff:0xff3e88;
  mesh=new THREE.Group();

  const body=new THREE.Mesh(
   new THREE.BoxGeometry(.8,1.2,.45),
   new THREE.MeshStandardMaterial({color})
  );
  body.position.y=1.05;
  mesh.add(body);

  const head=new THREE.Mesh(
   new THREE.SphereGeometry(.3,12,10),
   new THREE.MeshStandardMaterial({color:0xc9e5f2})
  );
  head.position.y=1.85;
  mesh.add(head);

  const marker=new THREE.Mesh(
   new THREE.BoxGeometry(.65,.08,.08),
   new THREE.MeshBasicMaterial({color:0x00ffff})
  );
  marker.position.y=2.2;
  mesh.add(marker);

  game.scene.add(mesh);
  game.remotes.set(p.id,mesh);
 }

 mesh.position.set(p.x,0,p.z);
 mesh.rotation.y=p.yaw;
}

function cleanupGame(){
 if(!game)return;
 game.running=false;
 cancelAnimationFrame(game.frame);

 const h=game.handlers;
 if(h){
  game.renderer.domElement.removeEventListener("click",h.onClick);
  game.renderer.domElement.removeEventListener("mousedown",h.onMouseDown);
  window.removeEventListener("keydown",h.onKeyDown);
  window.removeEventListener("keyup",h.onKeyUp);
  document.removeEventListener("mousemove",h.onMouseMove);
  window.removeEventListener("resize",h.onResize);
 }

 game.renderer.dispose();
 game.renderer.domElement.remove();
 game=null;
 remotePlayers.clear();
}

function logout(){
 leaveMatch();
 if(socket)socket.disconnect();
 socket=null;
 token=null;
 me=null;
 sessionStorage.removeItem("fw_token");
 $("dashboard").classList.add("hidden");
 $("loginPanel").classList.remove("hidden");
 $("connection").textContent="尚未連線";
 message("已登出");
}

// -----------------------
// RESTORE SESSION
// -----------------------
async function restoreSession(){
 if(!token)return;

 try{
  const data=await api("/api/me");
  me=data.user;
  $("loginPanel").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  updateProfile(me);
  connectSocket();
  loadLeaderboard();
 }catch{
  token=null;
  sessionStorage.removeItem("fw_token");
 }
}
restoreSession();

</script>
</body>
</html>
